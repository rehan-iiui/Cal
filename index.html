<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All-In-One Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="topbar">
    <div>
      <div class="brand">CALC<span>³</span></div>
      <div class="subtitle">All-In-One Calculator</div>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="Theme">☀</button>
      <button class="icon-btn" id="clearHistoryBtn" title="Clear History">🗑</button>
    </div>
  </header>

  <main class="main-grid">

    <!-- CALCULATOR -->
    <section class="calculator-card">

      <div class="display-panel">

        <div class="expression" id="expression">
          0
        </div>

        <div class="result" id="result">
          0
        </div>

        <div class="display-tools">
          <button id="copyBtn">COPY</button>
          <button id="ansBtn">ANS</button>
        </div>

      </div>

      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="standard">
          Standard
        </button>

        <button class="mode-tab" data-mode="scientific">
          Scientific
        </button>

        <button class="mode-tab" data-mode="converter">
          Converter
        </button>

        <button class="mode-tab" data-mode="tools">
          Tools
        </button>
      </div>

      <!-- STANDARD -->

      <div class="calculator-area" id="standardMode">

        <div class="button-grid">

          <button class="calc-btn function red" data-action="clear">AC</button>
          <button class="calc-btn function" data-action="delete">DEL</button>
          <button class="calc-btn function" data-value="%">%</button>
          <button class="calc-btn operator" data-value="/">÷</button>

          <button class="calc-btn" data-value="7">7</button>
          <button class="calc-btn" data-value="8">8</button>
          <button class="calc-btn" data-value="9">9</button>
          <button class="calc-btn operator" data-value="*">×</button>

          <button class="calc-btn" data-value="4">4</button>
          <button class="calc-btn" data-value="5">5</button>
          <button class="calc-btn" data-value="6">6</button>
          <button class="calc-btn operator" data-value="-">−</button>

          <button class="calc-btn" data-value="1">1</button>
          <button class="calc-btn" data-value="2">2</button>
          <button class="calc-btn" data-value="3">3</button>
          <button class="calc-btn operator" data-value="+">+</button>

          <button class="calc-btn wide" data-value="0">0</button>
          <button class="calc-btn" data-value=".">.</button>
          <button class="calc-btn equals" data-action="equals">=</button>

        </div>

      </div>


      <!-- SCIENTIFIC -->

      <div class="calculator-area hidden" id="scientificMode">

        <div class="scientific-grid">

          <button class="sci-btn" data-scientific="sin">sin</button>
          <button class="sci-btn" data-scientific="cos">cos</button>
          <button class="sci-btn" data-scientific="tan">tan</button>
          <button class="sci-btn" data-scientific="log">log</button>
          <button class="sci-btn" data-scientific="ln">ln</button>

          <button class="sci-btn" data-scientific="asin">sin⁻¹</button>
          <button class="sci-btn" data-scientific="acos">cos⁻¹</button>
          <button class="sci-btn" data-scientific="atan">tan⁻¹</button>
          <button class="sci-btn" data-scientific="sqrt">√</button>
          <button class="sci-btn" data-scientific="square">x²</button>

          <button class="sci-btn" data-scientific="cube">x³</button>
          <button class="sci-btn" data-scientific="factorial">x!</button>
          <button class="sci-btn" data-scientific="pi">π</button>
          <button class="sci-btn" data-scientific="e">e</button>
          <button class="sci-btn" data-scientific="abs">abs</button>

          <button class="sci-btn" data-scientific="floor">floor</button>
          <button class="sci-btn" data-scientific="ceil">ceil</button>
          <button class="sci-btn" data-scientific="random">random</button>
          <button class="sci-btn" data-scientific="negate">±</button>
          <button class="sci-btn" data-scientific="inverse">1/x</button>

        </div>

        <div class="angle-row">
          <button class="angle-btn active" data-angle="DEG">DEG</button>
          <button class="angle-btn" data-angle="RAD">RAD</button>
        </div>

        <div class="mini-standard">

          <button class="calc-btn function red" data-action="clear">AC</button>
          <button class="calc-btn function" data-action="delete">DEL</button>
          <button class="calc-btn operator" data-value="/">÷</button>
          <button class="calc-btn operator" data-value="*">×</button>

          <button class="calc-btn" data-value="7">7</button>
          <button class="calc-btn" data-value="8">8</button>
          <button class="calc-btn" data-value="9">9</button>
          <button class="calc-btn operator" data-value="-">−</button>

          <button class="calc-btn" data-value="4">4</button>
          <button class="calc-btn" data-value="5">5</button>
          <button class="calc-btn" data-value="6">6</button>
          <button class="calc-btn operator" data-value="+">+</button>

          <button class="calc-btn" data-value="1">1</button>
          <button class="calc-btn" data-value="2">2</button>
          <button class="calc-btn" data-value="3">3</button>
          <button class="calc-btn equals" data-action="equals">=</button>

          <button class="calc-btn wide" data-value="0">0</button>
          <button class="calc-btn" data-value=".">.</button>

        </div>

      </div>


      <!-- CONVERTER -->

      <div class="calculator-area hidden" id="converterMode">

        <div class="converter-card">

          <label>Category</label>

          <select id="converterCategory">
            <option value="length">Length</option>
            <option value="weight">Weight</option>
            <option value="temperature">Temperature</option>
            <option value="area">Area</option>
            <option value="volume">Volume</option>
            <option value="time">Time</option>
            <option value="speed">Speed</option>
            <option value="digital">Digital Data</option>
            <option value="currency">Currency</option>
          </select>

          <div class="converter-row">

            <div>
              <label>From</label>
              <select id="fromUnit"></select>
            </div>

            <button id="swapBtn" class="swap-btn">⇄</button>

            <div>
              <label>To</label>
              <select id="toUnit"></select>
            </div>

          </div>

          <input
            id="convertInput"
            class="big-input"
            type="number"
            placeholder="Enter value"
            value="1"
          >

          <div class="conversion-result" id="conversionResult">
            1
          </div>

          <button class="convert-btn" id="convertBtn">
            CONVERT
          </button>

        </div>

      </div>


      <!-- TOOLS -->

      <div class="calculator-area hidden" id="toolsMode">

        <div class="tools-grid">

          <button class="tool-card" data-tool="percentage">
            <span>％</span>
            Percentage
          </button>

          <button class="tool-card" data-tool="discount">
            <span>🏷</span>
            Discount
          </button>

          <button class="tool-card" data-tool="tip">
            <span>💵</span>
            Tip
          </button>

          <button class="tool-card" data-tool="bmi">
            <span>⚖</span>
            BMI
          </button>

          <button class="tool-card" data-tool="age">
            <span>🎂</span>
            Age
          </button>

          <button class="tool-card" data-tool="fraction">
            <span>½</span>
            Fraction
          </button>

          <button class="tool-card" data-tool="number">
            <span>01</span>
            Number System
          </button>

          <button class="tool-card" data-tool="time">
            <span>⏱</span>
            Time Calculator
          </button>

        </div>

        <div id="toolPanel" class="tool-panel">

          <h2>Select a Tool</h2>
          <p>Choose one of the tools above.</p>

        </div>

      </div>

    </section>


    <!-- HISTORY -->

    <aside class="history-card">

      <div class="history-header">
        <div>
          <h2>History</h2>
          <span id="historyCount">0 calculations</span>
        </div>

        <button id="historyClear">Clear</button>
      </div>

      <div id="historyList" class="history-list">

        <div class="empty-history">
          <div class="empty-icon">⌁</div>
          <p>No calculations yet</p>
          <span>Your calculations will appear here.</span>
        </div>

      </div>

    </aside>

  </main>

</div>

<div class="toast" id="toast">
  Copied!
</div>

<script src="script.js"></script>

</body>
</html>
